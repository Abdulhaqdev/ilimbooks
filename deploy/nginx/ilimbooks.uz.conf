# Landing — ilimbooks.uz (va www)
server {
  listen 80;
  server_name ilimbooks.uz www.ilimbooks.uz;

  root /var/www/ilimbooks/apps/landing/dist;
  index index.html;

  # API — bitta Nest backend (port 3040)
  location /api/ {
    proxy_pass http://127.0.0.1:3040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html — keshlanmasin (yangi deploy darhol ko'rinsin)
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # statik assetlar — uzoq kesh
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
