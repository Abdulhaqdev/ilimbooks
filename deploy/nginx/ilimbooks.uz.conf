# Landing — ilimbooks.uz (va www)
server {
  listen 80;
  server_name ilimbooks.uz www.ilimbooks.uz;

  root /var/www/ilimbooks/apps/landing/dist;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # API — bitta Nest backend (port 3040); ^~ — rasm regex'i /api/uploads'ni ushlab qolmasin
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:3040;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html — keshlanmasin (yangi deploy darhol ko'rinsin)
  location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  # statik assetlar — uzoq kesh
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # mahsulot rasmlari / video — 7 kun kesh
  location ~* \.(?:webp|jpe?g|png|gif|svg|ico|mp4)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
