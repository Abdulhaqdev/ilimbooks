<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e3b2e" />
    <title>Soyali Qur'on Husnixati — Yozib o'rganish uchun eng qulay usul</title>
    <meta name="description" content="Soyali Qur'on Husnixati — soyali matn ustidan yozib husnixatni oson o'rganing. Aksiya narxida. Buyurtma berish uchun ism va telefon raqamingizni qoldiring." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Soyali Qur'on Husnixati — Aksiya narxida" />
    <meta property="og:description" content="Yozib o'rganish uchun eng qulay usul. Bugungi aksiya narxida buyurtma bering." />
    <meta property="og:type" content="product" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Landing ma'lumoti JS bundle bilan parallel so'raladi; birinchi rasm darhol yuklana boshlaydi -->
    <script>
    (function () {
      try {
        if (/[?&]preview=1(&|$)/.test(location.search)) return;
        var p = location.pathname.replace(/\/+$/, '') || '/';
        var data = fetch('/api/public/landing?path=' + encodeURIComponent(p)).then(function (r) {
          return r.ok ? r.json() : null;
        });
        window.__ibLanding = { path: p, data: data };
        data.then(function (d) {
          var img = d && d.content && d.content.images && d.content.images[0];
          if (!img) return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = img;
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        }).catch(function () {});
      } catch (e) {}
    })();
    </script>
    <!-- Shrift sahifani bloklamaydi: avval tizim shrifti, yuklangach almashadi -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" /></noscript>
    <!-- Meta Pixel Code (init + PageView src/pixel.ts — Pixel ID admin paneldan) -->
    <script data-cfasync="false">
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    </script>
    <!-- End Meta Pixel Code -->
    <!-- Skelet: HTML kelishi bilan darhol chiziladi, React yuklanganda o'zi almashadi.
         Instagram ichki brauzerida foydalanuvchi qora ekran o'rniga sahifa shaklini ko'radi. -->
    <style>
      .ib-skel {
        min-height: 100vh;
        background:
          radial-gradient(900px 500px at 15% -5%, rgba(22,160,111,.28), transparent 60%),
          radial-gradient(800px 500px at 100% 12%, rgba(212,175,55,.14), transparent 55%),
          linear-gradient(180deg, #0b3a2c 0, #082a20 55%, #061f17 100%);
      }
      .ib-skel-wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: 4px 16px 36px; }
      .ib-skel-hd { display: flex; align-items: center; justify-content: space-between; padding: 12px 2px 14px; }
      .ib-sk {
        background: linear-gradient(90deg, rgba(255,255,255,.055) 0, rgba(255,255,255,.13) 40%, rgba(255,255,255,.055) 80%);
        background-size: 600px 100%;
        animation: ib-sk 1.5s linear infinite;
        border-radius: 10px;
      }
      @keyframes ib-sk { 0% { background-position: -200px 0; } 100% { background-position: 460px 0; } }
      @media (prefers-reduced-motion: reduce) { .ib-sk { animation: none; } }
      .ib-skel-brand { width: 148px; height: 22px; }
      .ib-skel-chip { width: 74px; height: 28px; border-radius: 999px; }
      .ib-skel-gal {
        aspect-ratio: 1 / 1; max-height: 50vh; border-radius: 22px;
        border: 1px solid rgba(212,175,55,.25); margin-bottom: 18px;
      }
      .ib-skel-chips { display: flex; gap: 8px; margin-bottom: 14px; }
      .ib-skel-chips span { height: 30px; border-radius: 999px; flex: 0 0 auto; }
      .ib-skel-chips span:nth-child(1) { width: 92px; }
      .ib-skel-chips span:nth-child(2) { width: 118px; }
      .ib-skel-chips span:nth-child(3) { width: 76px; }
      .ib-skel-title { height: 30px; margin-bottom: 9px; }
      .ib-skel-title.s { width: 62%; margin-bottom: 16px; }
      .ib-skel-sub { height: 17px; width: 85%; margin-bottom: 22px; }
      .ib-skel-price { height: 44px; width: 60%; border-radius: 14px; margin-bottom: 20px; }
      .ib-skel-cta {
        height: 56px; border-radius: 16px;
        background: linear-gradient(90deg, rgba(212,175,55,.30) 0, rgba(243,208,106,.50) 40%, rgba(212,175,55,.30) 80%);
        background-size: 600px 100%;
        animation: ib-sk 1.5s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) { .ib-skel-cta { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="ib-skel" aria-hidden="true"><div class="ib-skel-wrap">
      <div class="ib-skel-hd"><div class="ib-sk ib-skel-brand"></div><div class="ib-sk ib-skel-chip"></div></div>
      <div class="ib-sk ib-skel-gal"></div>
      <div class="ib-skel-chips"><span class="ib-sk"></span><span class="ib-sk"></span><span class="ib-sk"></span></div>
      <div class="ib-sk ib-skel-title"></div>
      <div class="ib-sk ib-skel-title s"></div>
      <div class="ib-sk ib-skel-sub"></div>
      <div class="ib-sk ib-skel-price"></div>
      <div class="ib-skel-cta"></div>
    </div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
